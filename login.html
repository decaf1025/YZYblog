<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="./bootstrap-5.3.7/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="script.js" defer></script>
</head>
<body class="bg-light">
  <section class="container d-flex flex-column justify-content-center align-items-center min-vh-100"  id="signUp">
    <div class="text-center mb-4">
      <h1 class="fw-bold text-primary"><i class="bi bi-chat-dots-fill me-1"></i> YZYblog</h1>
    </div>

    <div class="card shadow p-4 w-100" style="max-width: 400px;">
      <h3 class="text-center mb-4">Login</h3>

      <form method="post" action="login_process.php" id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username:</label>
          <input type="text" class="form-control border-primary" id="username" name="username" placeholder="Enter your Username..." />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input type="password" class="form-control border-primary" id="password" name="password" placeholder="Enter your Password..." />
        </div>
          <p id="message"></p>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary">
            Sign Up
          </button>
        </div>

        <div class="text-center mb-2">
          <small class="text-muted">or</small>
        </div>

        <div class="d-grid">
          <button type="button" class="btn btn-outline-secondary">
            <img src="https://www.svgrepo.com/show/355037/google.svg" width="20" class="me-2">
            Sign up with Google
          </button>
        </div>
      </form>

    </div>
  </section>

    <script src="./bootstrap-5.3.7/dist/js/bootstrap.bundle.js"></script>
    <script src="script.js"></script>
</body>
</html>
